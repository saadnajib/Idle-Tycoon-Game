<style>
  :root { --s: 1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07060d; }
  body {
    position: fixed; inset: 0; height: 100vh; height: 100dvh;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; color: #eef0ff;

  #ui { position: absolute; left: 0; top: 0; width: 400px; height: 720px; pointer-events: none; overflow: hidden; }
  .fade { transition: opacity .35s ease; }
  .gone { opacity: 0 !important; }
  #score { position: absolute; left: 0; right: 0; top: calc(26px * var(--s)); text-align: center;

    text-shadow: 0 calc(3px * var(--s)) calc(18px * var(--s)) rgba(0,0,0,.55), 0 0 calc(24px * var(--s)) rgba(120,190,255,.25); }
  #best { position: absolute; left: 0; right: 0; top: calc(96px * var(--s)); text-align: center;
    font-size: calc(13px * var(--s)); font-weight: 600; letter-spacing: .14em; color: rgba(220,225,255,.55); text-transform: uppercase; }
  #combo { position: absolute; right: calc(14px * var(--s)); top: calc(18px * var(--s)); text-align: right;
    font-size: calc(15px * var(--s)); font-weight: 700; color: #bff6ff; letter-spacing: .04em;
    text-shadow: 0 0 calc(12px * var(--s)) rgba(80,230,255,.6); opacity: 0; transition: opacity .3s; }
  #combo.on { opacity: 1; }
  #combo b { font-size: calc(22px * var(--s)); }
  .iconbtn { position: absolute; left: calc(10px * var(--s)); top: calc(12px * var(--s)); width: calc(44px * var(--s)); height: calc(44px * var(--s));
    border: 0; border-radius: 50%; background: rgba(255,255,255,.07); color: #dfe4ff; pointer-events: auto; padding: 0;
    display: flex; align-items: center; justify-content: center; }
  .iconbtn svg { width: 55%; height: 55%; }
  #title { position: absolute; left: 0; right: 0; top: calc(128px * var(--s)); text-align: center; }
  #title h1 { margin: 0; font-size: calc(58px * var(--s)); font-weight: 800; letter-spacing: .22em; padding-left: .22em;
    background: linear-gradient(90deg, #5ff0ff, #9b7bff 45%, #ff7ad9 80%, #ffc36b); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 calc(16px * var(--s)) rgba(140,120,255,.45)); }
  #tbest { margin-top: calc(8px * var(--s)); font-size: calc(13px * var(--s)); letter-spacing: .16em; color: rgba(220,225,255,.6); font-weight: 600; }
  #hint { position: absolute; left: 0; right: 0; top: calc(470px * var(--s)); text-align: center; font-size: calc(17px * var(--s));
    font-weight: 600; letter-spacing: .12em; color: rgba(235,240,255,.85); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #paused { position: absolute; left: 0; right: 0; top: 44%; text-align: center; font-size: calc(18px * var(--s)); font-weight: 700; letter-spacing: .1em; }
  .card { position: absolute; left: 7%; right: 7%; bottom: calc(34px * var(--s)); text-align: center;
    padding: calc(16px * var(--s)) calc(18px * var(--s)) calc(12px * var(--s)); border-radius: calc(22px * var(--s));
    background: linear-gradient(180deg, rgba(38,28,78,.97), rgba(14,11,32,.98)); border: 1px solid rgba(170,200,255,.16);
    box-shadow: 0 calc(20px * var(--s)) calc(60px * var(--s)) rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    transform: translateY(135%); opacity: 0; transition: transform .45s cubic-bezier(.2,.9,.3,1.08), opacity .25s; pointer-events: none; }
  .card.show { transform: none; opacity: 1; pointer-events: auto; }
  .lbl { font-size: calc(11px * var(--s)); letter-spacing: .22em; color: rgba(210,215,255,.55); font-weight: 700; }
  #oScore { font-size: calc(60px * var(--s)); font-weight: 800; line-height: 1.05; }
  .row { display: flex; justify-content: center; align-items: center; gap: calc(10px * var(--s)); font-size: calc(14px * var(--s)); color: rgba(225,230,255,.75); }
  #newBest { font-weight: 800; color: #ffd66b; letter-spacing: .12em; font-size: calc(12px * var(--s)); display: none; animation: flash .5s steps(2) infinite; }
  #newBest.on { display: inline; }
  @keyframes flash { 50% { color: #ff7ad9; } }
  #preview { display: block; width: 100%; height: calc(56px * var(--s)); margin: calc(8px * var(--s)) 0 calc(2px * var(--s)); }
  #oLen { font-size: calc(13px * var(--s)); color: rgba(225,230,255,.8); }
  #oLen span { color: rgba(225,230,255,.5); }
  .btn { display: block; width: 100%; margin-top: calc(12px * var(--s)); border: 0; border-radius: 999px; pointer-events: auto;
    padding: calc(12px * var(--s)) calc(14px * var(--s)); font: inherit; font-size: calc(15px * var(--s)); font-weight: 800; color: #0a0f24;
    background: linear-gradient(90deg, #5ff0ff, #a58bff); box-shadow: 0 0 calc(18px * var(--s)) rgba(110,200,255,.35); }
  .btn[hidden] { display: none; }
  .tap { margin-top: calc(12px * var(--s)); font-size: calc(15px * var(--s)); font-weight: 700; letter-spacing: .14em; animation: pulse 1.4s ease-in-out infinite; }
  .shop { margin-top: calc(12px * var(--s)); padding-top: calc(10px * var(--s)); border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; gap: calc(8px * var(--s)); flex-wrap: wrap; }
  .sw { width: calc(26px * var(--s)); height: calc(26px * var(--s)); border-radius: 50%; border: 2px solid transparent; padding: 0; pointer-events: auto;
    position: relative; font-size: calc(11px * var(--s)); color: #fff; }
  .sw.sel { border-color: #fff; box-shadow: 0 0 calc(10px * var(--s)) rgba(255,255,255,.5); }
  .sw.locked { opacity: .45; }
  .sw.locked::after { content: "\1F512"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(11px * var(--s)); }
  .sw[data-pal=prism] { background: linear-gradient(135deg, #ff5e7e, #ffd25e, #5effa0, #5ecbff, #b05eff); }
  .sw[data-pal=aurora] { background: linear-gradient(135deg, #3dffa8, #3de0ff, #8f6bff); }
  .sw[data-pal=ember] { background: linear-gradient(135deg, #ff3b3b, #ff8a2a, #ffd23d); }
  .link { background: none; border: 0; padding: calc(4px * var(--s)); font: inherit; font-size: calc(12px * var(--s)); color: #9fdcff;
    text-decoration: underline; text-underline-offset: 2px; pointer-events: auto; }
  #modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(5,4,14,.9); touch-action: none; }
  #modal.show { display: flex; }
  .mbox { width: min(84vw, 340px); padding: 22px; border-radius: 18px; text-align: center; background: #151232; border: 1px solid rgba(170,200,255,.15); }
  .mbox h2 { margin: 0 0 6px; font-size: 18px; }
  .mbox p { margin: 0 0 14px; font-size: 13px; color: rgba(225,230,255,.65); }
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #5ff0ff, #a58bff); transform-origin: left; transform: scaleX(0); }
  .mbox .btn { font-size: 15px; padding: 11px; margin-top: 12px; }
  .mbox .link { font-size: 13px; margin-top: 8px; }
  #toast { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(20,16,50,.92);
    font-size: calc(13px * var(--s)); white-space: nowrap; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
</style>

<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<div id="ui">
  <div id="score" class="fade gone">0</div>
  <div id="best" class="fade gone">best 0</div>
  <div id="combo">graze <b>&times;0</b></div>
  <button id="mute" class="iconbtn" data-ui aria-label="Toggle sound"></button>
  <div id="title" class="fade"><h1>RIBBON</h1><div id="tbest"></div></div>
  <div id="hint" class="fade">tap to flap</div>
  <div id="paused" class="fade gone">PAUSED &middot; tap to resume</div>
  <div id="toast"></div>
  <div id="over" class="card">
    <div class="lbl">SCORE</div>

    <div class="row"><span>Best <b id="oBest">0</b></span><span id="newBest">NEW BEST</span></div>
    <canvas id="preview"></canvas>

    <div class="shop" data-ui>
      <button class="sw" data-pal="prism" data-ui aria-label="Prism style"></button>

      <button id="btnBuy" class="link" data-ui>Ribbon Styles pack $1.99</button>

    </div>
  </div>
</div>
<div id="modal" data-ui><div class="mbox" id="mbox"></div></div>
<script>
(() => {
'use strict';

// =====================================================================
// TUNING — every gameplay/visual constant lives here
// =====================================================================
const TUNING = {
  W: 400, H: 720,                        // logical playfield
  gravity: 1900, terminal: 950, flapV: -540, headR: 10,
  headX: 150, headXPerSeg: 2, headXMax: 200,   // head screen x; slides right as the ribbon grows so the solid part stays visible
  speed0: 190, speedPerGate: 6, speedMax: 320,
  gateSpacing: 260, gateW: 64, gateCorner: 14, firstGateAhead: 420,
  gap0: 190, gapPerGate: 2, gapMin: 150, gapMargin: 60, gapMaxDelta: 220,
  seg0: 24, segRest: 6, segEvery: 3, segMax: 48,
  ribbonGravity: 0.12,                   // x head gravity; higher = ribbon dangles, lower = it just traces the head's path
  damping: 0.985,                        // verlet velocity damping per step (world-space air drag)
  iterations: 3, maxStretch: 1.05,       // constraint passes + hard stretch cap
  solidFraction: 0.6, solidFractionCap: 0.45, segR: 4,   // solid share of the ribbon: 0.6 at seg0, lerps to the cap at segMax
  grazeCooldown: 0.18, comboWindow: 2.5,
  deathFreeze: 0.25, limpTime: 1.0, limpDamping: 0.94,
  continueSegments: 16, continueLead: 200, invulnTime: 1.0, adDuration: 2.5,
  widthHead: 14, widthSolidEnd: 7, widthLooseStart: 5, widthTail: 2,
  hueStep: 8, hueSpeed: 36, looseAlpha: 0.35,
  maxParticles: 200, step: 1 / 120, maxAccum: 0.25, maxDpr: 2,
};
const T = TUNING;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash = k => { const s = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

// =====================================================================
// State / Save
// =====================================================================
const SAVE_KEY = 'ribbon.save.v1';
const SKU_STYLES = 'ribbon_styles_pack';
const saveDefaults = () => ({ best: 0, mute: false, firstRun: true, games: 0, owned: {}, palette: 'prism' });
const SV = saveDefaults();
const isPlain = v => !!v && typeof v === 'object' && !Array.isArray(v);
const saveInt = v => Number.isInteger(v) && v >= 0 ? v : 0;
// Copies only known fields, each type-checked; anything else in the blob (including a "__proto__" key) is ignored.
function sanitizeSave(d) {
  const o = saveDefaults();
  if (!isPlain(d)) return o;
  o.best = saveInt(d.best); o.games = saveInt(d.games);
  o.mute = d.mute === true; o.firstRun = d.firstRun !== false;
  if (isPlain(d.owned)) for (const k of Object.keys(d.owned)) if (k !== '__proto__' && typeof d.owned[k] === 'boolean') o.owned[k] = d.owned[k];
  if (typeof d.palette === 'string' && Object.prototype.hasOwnProperty.call(PALETTES, d.palette) && (d.palette === 'prism' || o.owned[SKU_STYLES] === true)) o.palette = d.palette;
  return o;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { /* storage blocked: keep what is in memory */ }
  if (raw !== null) { let d = null; try { d = JSON.parse(raw); } catch (e) { /* corrupt: defaults */ } Object.assign(SV, sanitizeSave(d)); }
  return SV;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (e) { /* ignore */ } return SV; }

const MAXPTS = 128;
const S = {
  phase: 'ready',            // ready | play | freeze | limp | over
  t: 0, time: 0, manual: false, paused: false, title: true,
  seed: 1, rng: mulberry32(1),
  worldX: 0, pWorldX: 0, speed: T.speed0, headX: T.headX,
  head: { y: 330, vy: 0, py: 330 },
  rib: { n: T.seg0, x: new Float64Array(MAXPTS), y: new Float64Array(MAXPTS), ox: new Float64Array(MAXPTS), oy: new Float64Array(MAXPTS) },
  gates: [], gateCount: 0, nextGateX: 0, lastCenter: T.H / 2,
  score: 0, grazes: 0, combo: 0, comboT: 0, grazeCd: 0, touching: false, wasTouching: false, sparkT: 0,
  invuln: 0, continued: false, newBest: false,
  death: { seg: -1, x: 0, y: 0 },
  perf: { last: 0, sum: 0, frames: 0 },
};
// the one place the solid/loose split is computed (collision, floor clamp, render, death highlight, game-over preview)
const solidCount = n => { const u = clamp((n - T.seg0) / Math.max(1, T.segMax - T.seg0), 0, 1); return Math.round(n * (T.solidFraction + (T.solidFractionCap - T.solidFraction) * u)); };

function layRibbon(n) {
  const R = S.rib; R.n = Math.min(n, MAXPTS - 1);
  const hx = S.worldX + S.headX;
  for (let i = 0; i <= R.n; i++) { R.x[i] = R.ox[i] = hx - i * T.segRest; R.y[i] = R.oy[i] = S.head.y; }
}
function growRibbon() {
  const R = S.rib; if (R.n >= Math.min(T.segMax, MAXPTS - 1)) return;
  const n = ++R.n, X = R.x, Y = R.y;
  let dx = X[n - 1] - X[n - 2], dy = Y[n - 1] - Y[n - 2]; const d = Math.hypot(dx, dy) || 1;
  X[n] = X[n - 1] + dx / d * T.segRest; Y[n] = Y[n - 1] + dy / d * T.segRest;
  R.ox[n] = X[n] - (X[n - 1] - R.ox[n - 1]); R.oy[n] = Y[n] - (Y[n - 1] - R.oy[n - 1]);
}

function restart(seed) {
  S.seed = (seed === undefined ? (Math.random() * 2147483647) | 0 : seed) >>> 0;
  S.rng = mulberry32(S.seed);
  S.phase = 'ready'; S.t = 0; S.paused = false;
  S.worldX = S.pWorldX = 0; S.speed = T.speed0; S.headX = T.headX;
  S.head.y = S.head.py = 330; S.head.vy = 0;
  S.gates.length = 0; S.gateCount = 0; S.lastCenter = T.H / 2; S.nextGateX = 0;
  S.score = 0; S.grazes = 0; S.combo = 0; S.comboT = 0; S.grazeCd = 0; S.touching = false; S.wasTouching = false; S.sparkT = 0;
  S.invuln = 0; S.continued = false; S.newBest = false; S.death.seg = -1;
  layRibbon(T.seg0);
  clearParticles();
  UI.phase();
}

function startPlay() {
  S.phase = 'play'; S.t = 0; S.title = false;
  S.nextGateX = S.worldX + S.headX + T.firstGateAhead;
  while (S.nextGateX < S.worldX + T.W + 300) spawnGate();
  if (SV.firstRun) SV.firstRun = false;
  SV.games++; save();
  UI.phase();
}

// =====================================================================
// Input
// =====================================================================
function flap() {
  if (S.phase === 'ready') startPlay();
  if (S.phase !== 'play') return;
  S.head.vy = T.flapV;
  const hx = S.worldX + S.headX, hy = S.head.y;
  for (let i = 0; i < 7; i++) emit(0, hx - 4 + (Math.random() - .5) * 8, hy + 8, (Math.random() - .5) * 120, 120 + Math.random() * 110, .28 + Math.random() * .16, 2 + Math.random() * 2, 0);
  Sfx.flap();
}
function press() {
  if (Monetization.busy) return;
  if (S.paused) { S.paused = false; UI.phase(); return; }
  if (S.phase === 'ready' || S.phase === 'play') flap();
  else if (S.phase === 'over' && S.t > 0.45) { restart(); flap(); }
}
function isUI(el) { return !!(el && el.closest && el.closest('[data-ui]')); }
window.addEventListener('pointerdown', e => {
  Sfx.unlock();
  if (isUI(e.target)) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  press();
}, { passive: false });
['pointerup', 'click', 'touchend'].forEach(ev => window.addEventListener(ev, () => Sfx.unlock(), { passive: true }));
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) { Sfx.unlock(); press(); } }
  else if (e.code === 'KeyM') UI.toggleMute();
});
['contextmenu', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// =====================================================================
// Physics — head, ribbon verlet, gates, collision
// =====================================================================
function stepSim(dt) {
  S.time += dt; S.t += dt;
  S.pWorldX = S.worldX; S.head.py = S.head.y;
  const ph = S.phase, h = S.head;
  const hxT = clamp(T.headX + (S.rib.n - T.seg0) * T.headXPerSeg, T.headX, T.headXMax);
  if (ph === 'play' || ph === 'ready') S.headX += (hxT - S.headX) * Math.min(1, dt * 1.5);
  if (ph === 'ready') {
    S.worldX += T.speed0 * dt;
    h.y = 330 + Math.sin(S.time * 3.4) * 20; h.vy = Math.cos(S.time * 3.4) * 68;
    ribbonStep(dt, true, T.ribbonGravity, T.damping);
  } else if (ph === 'play') {
    S.worldX += S.speed * dt;
    h.vy += T.gravity * dt; if (h.vy > T.terminal) h.vy = T.terminal;
    h.y += h.vy * dt;
    if (S.invuln > 0) { if (h.y < T.headR) { h.y = T.headR; h.vy = Math.max(h.vy, 0); } if (h.y > T.H - T.headR) { h.y = T.H - T.headR; h.vy = T.flapV * .7; } }
    ribbonStep(dt, true, T.ribbonGravity, T.damping);
    updateGates();
    const lethal = collide();
    if (S.invuln > 0) { S.invuln -= dt; if (S.invuln <= 0 && lethal) S.invuln = 0.05; }
    else if (lethal) die();
    updateGraze(dt);
  } else if (ph === 'freeze') {
    if (S.t >= T.deathFreeze) goLimp();
  } else if (ph === 'limp' || ph === 'over') {
    ribbonStep(dt, false, 1, T.limpDamping);
    h.y = S.rib.y[0];
    if (ph === 'limp' && S.t >= T.limpTime) showOver();
  }
  if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  stepParticles(dt);
}

function ribbonStep(dt, pinned, gmul, damp) {
  const R = S.rib, n = R.n, X = R.x, Y = R.y, OX = R.ox, OY = R.oy;
  const g = T.gravity * gmul * dt * dt;
  for (let i = pinned ? 1 : 0; i <= n; i++) {
    const vx = (X[i] - OX[i]) * damp, vy = (Y[i] - OY[i]) * damp;
    OX[i] = X[i]; OY[i] = Y[i]; X[i] += vx; Y[i] += vy + g;
  }
  if (pinned) { OX[0] = X[0]; OY[0] = Y[0]; X[0] = S.worldX + S.headX; Y[0] = S.head.y; }
  const rest = T.segRest;
  for (let it = 0; it < T.iterations; it++) {
    for (let i = 0; i < n; i++) {
      const dx = X[i + 1] - X[i], dy = Y[i + 1] - Y[i];
      const d = Math.sqrt(dx * dx + dy * dy) || 1e-6, k = (d - rest) / d;
      if (i === 0 && pinned) { X[1] -= dx * k; Y[1] -= dy * k; }
      else { const hk = k * 0.5; X[i] += dx * hk; Y[i] += dy * hk; X[i + 1] -= dx * hk; Y[i + 1] -= dy * hk; }
    }
  }
  // follow-the-leader cap (never longer than 105%). The previous position moves with the point so the
  // correction adds no velocity; without that the cap pumps energy into the tail and it whips ahead of the head.
  const maxL = rest * T.maxStretch;
  for (let i = 0; i < n; i++) {
    const dx = X[i + 1] - X[i], dy = Y[i + 1] - Y[i], d = Math.sqrt(dx * dx + dy * dy);
    if (d > maxL) {
      const f = maxL / d, nx = X[i] + dx * f, ny = Y[i] + dy * f;

  c.lineJoin = 'round'; c.lineCap = 'butt';
  c.globalCompositeOperation = 'lighter';          // fake glow: two wide additive passes, no shadowBlur
  for (let pass = 0; pass < 4; pass++) {
    const wm = GLOW_W[pass], wa = GLOW_ADD[pass], am = GLOW_A[pass];
    for (let k = 0; k <= n; k++) {
      c.globalAlpha = (k > sc ? am * 0.3 : am) * alpha;
      c.lineCap = k === sc ? 'round' : 'butt';
      c.strokeStyle = PAL.glow[hi(base, k)]; c.lineWidth = WD[k] * wm + (k > sc ? wa * 0.5 : wa);
      c.beginPath(); piece(c, X, Y, n, k); c.stroke();
    }
  }
  c.globalCompositeOperation = 'source-over';
  for (let k = n; k >= 0; k--) {                   // core: solid = saturated + opaque, loose = ghosted
    const loose = k > sc;
    c.globalAlpha = (loose ? T.looseAlpha : 1) * alpha;
    c.strokeStyle = loose ? PAL.loose[hi(base, k)] : PAL.core[hi(base, k)];
    c.lineCap = loose ? 'butt' : 'round'; c.lineWidth = WD[k];
    c.beginPath(); piece(c, X, Y, n, k); c.stroke();
  }
  c.lineCap = 'round'; c.strokeStyle = '#fff'; c.globalAlpha = 0.5 * alpha;   // hot core: 3 single-path chunks, no beads
  for (let ch = 0; ch < 3; ch++) {
    const k0 = Math.floor(sc * ch / 3), k1 = Math.floor(sc * (ch + 1) / 3); if (k1 <= k0) continue;
    c.lineWidth = WD[(k0 + k1) >> 1] * 0.26; c.beginPath();
    for (let k = k0; k < k1; k++) piece(c, X, Y, n, k);
    c.stroke();
  }
  c.globalAlpha = 1;
}
function drawHead(c, x, y, vy, base, alpha) {
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.85 * alpha;
  c.drawImage(C.headGlow, x - 32, y - 32, 64, 64);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = alpha;
  const col = PAL.core[hi(base, 0)];
  c.save(); c.translate(x, y); c.rotate(clamp(vy / T.terminal, -1, 1) * 0.55);
  c.strokeStyle = col; c.lineWidth = 2.2; c.beginPath(); c.ellipse(0, 0, 13.5, 10.5, 0, 0, TAU); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 7, 0, TAU); c.fill();
  c.fillStyle = col; c.beginPath(); c.arc(3.4, 0, 2.3, 0, TAU); c.fill();
  c.restore(); c.globalAlpha = 1;
}
function drawParticles(wx) {
  const c = ctx; c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PN; i++) {
    const l = P.life[i]; if (l <= 0) continue;
    const a = l / P.max[i], x = P.x[i] - wx, y = P.y[i], s = P.size[i];
    c.globalAlpha = a;
    if (P.kind[i] === 0) { const r = s * (2.2 - a); c.drawImage(C.puff, x - r, y - r, r * 2, r * 2); }
    else {
      c.fillStyle = P.hue[i] < 0 ? '#ffc4d2' : PAL.spark[P.hue[i]];
      const ss = s * (0.5 + a); c.fillRect(x - ss, y - 0.6, ss * 2, 1.2); c.fillRect(x - 0.6, y - ss, 1.2, ss * 2);
    }
  }
  c.font = '700 13px system-ui, -apple-system, Roboto, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#d6fbff';
  if (S.phase !== 'freeze') for (let i = 0; i < TX.length; i++) { const t = TX[i]; if (t.life <= 0) continue; c.globalAlpha = Math.min(1, t.life / 0.5); c.fillText('graze!', t.x - wx, t.y); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}
function drawDeath(wx) {
  const ph = S.phase; if (ph !== 'freeze' && ph !== 'limp') return;
  const c = ctx, d = S.death, fade = ph === 'freeze' ? 1 : clamp(1 - S.t / 0.6, 0, 1);
  if (fade <= 0) return;
  const cx = d.x - wx, cy = d.y;
  if (ph === 'freeze') {                            // the "why did I die" frame
    c.lineCap = 'round'; c.strokeStyle = '#fff';
    if (d.seg >= 0) {
      const i = d.seg; c.lineWidth = WD[i + 1] + 5; c.globalAlpha = 1;
      c.beginPath(); c.moveTo(RX[i], RY[i]); c.lineTo(RX[i + 1], RY[i + 1]); c.stroke();
    } else { c.lineWidth = 3; c.beginPath(); c.arc(RX[0], RY[0], 12, 0, TAU); c.stroke(); }
  }
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.8 * fade;
  c.drawImage(C.redGlow, cx - 30, cy - 30, 60, 60);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = fade;
  c.strokeStyle = '#ff3b5f'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, 13 + (1 - fade) * 16, 0, TAU); c.stroke();
  c.globalAlpha = 1;
}

function render(alpha) {
  const live = S.phase === 'play' || S.phase === 'ready', a = live ? alpha : 1, c = ctx;
  const wx = S.pWorldX + (S.worldX - S.pWorldX) * a;
  c.setTransform(V.k, 0, 0, V.k, V.ox * V.dpr, V.oy * V.dpr);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = C.bg; c.fillRect(V.leftL, V.topL, V.rightL - V.leftL, V.botL - V.topL);
  drawLayer(C.L1, 0.2, wx); drawLayer(C.L2, 0.5, wx);
  c.fillStyle = 'rgba(160,190,255,0.14)'; c.fillRect(V.leftL, -0.5, V.rightL - V.leftL, 1);   // ceiling
  drawGates(wx);
  drawFloor();
  const R = S.rib, n = R.n;
  for (let i = 0; i <= n; i++) { RX[i] = R.ox[i] + (R.x[i] - R.ox[i]) * a - wx; RY[i] = R.oy[i] + (R.y[i] - R.oy[i]) * a; }
  if (S.phase === 'freeze') { c.fillStyle = C.dim; c.fillRect(V.leftL, V.topL, V.rightL - V.leftL, V.botL - V.topL); }
  const base = S.time * T.hueSpeed, ra = S.invuln > 0 && (Math.floor(S.time * 14) & 1) ? 0.3 : 1;
  drawRibbon(c, RX, RY, n, solidCount(n), base, ra);
  drawHead(c, RX[0], RY[0], S.head.vy, base, ra);
  drawParticles(wx);
  drawDeath(wx);
  if (V.leftL < -1) {
    c.fillStyle = C.edgeL; c.fillRect(V.leftL, V.topL, -V.leftL, V.botL - V.topL);
    c.fillStyle = C.edgeR; c.fillRect(T.W, V.topL, V.rightL - T.W, V.botL - V.topL);
  }
}

// =====================================================================
// HUD / UI (DOM overlay sized to the playfield; canvas does the world)
// =====================================================================
const UI = (() => {
  const $ = id => document.getElementById(id);
  const el = {}; ['score', 'best', 'combo', 'mute', 'title', 'tbest', 'hint', 'paused', 'over', 'oScore', 'oBest', 'newBest', 'oLen', 'btnCont', 'preview', 'toast', 'btnBuy', 'btnRestore'].forEach(k => el[k] = $(k));
  const pctx = el.preview.getContext('2d');
  const PX = new Float32Array(MAXPTS), PY = new Float32Array(MAXPTS);
  let shownScore = -1, shownCombo = -1, comboOn = false, toastT = 0, pw = 1, ph = 1, pdpr = 1;
  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

  function phase() {
    const p = S.phase, title = p === 'ready' && S.title;
    el.title.classList.toggle('gone', !title);
    el.hint.classList.toggle('gone', !title);
    el.hint.textContent = SV.firstRun ? 'tap to flap' : 'tap to start';
    el.tbest.textContent = SV.best > 0 ? 'BEST ' + SV.best : '';
    const hud = !title && p !== 'over';
    el.score.classList.toggle('gone', !hud); el.best.classList.toggle('gone', !hud);
    el.best.textContent = 'best ' + SV.best;
    el.paused.classList.toggle('gone', !S.paused);
    if (p === 'over') showCard(); else el.over.classList.remove('show');
    shownScore = -1; tick();
  }
  function tick() {
    if (S.score !== shownScore) { shownScore = S.score; el.score.textContent = S.score; }
    const on = S.combo > 0 && S.phase === 'play';
    if (on !== comboOn) { comboOn = on; el.combo.classList.toggle('on', on); }
    if (toastT && performance.now() > toastT) { toastT = 0; el.toast.classList.remove('on'); }
    if (S.phase === 'over' && el.over.classList.contains('show')) drawPreview();
  }
  function combo() {
    if (S.combo !== shownCombo) { shownCombo = S.combo; el.combo.innerHTML = 'graze <b>&times;' + S.combo + '</b>'; }
    try { el.combo.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'ease-out' }); } catch (e) { /* old webview */ }
  }
  function showCard() {
    el.oScore.textContent = S.score; el.oBest.textContent = SV.best;
    el.newBest.classList.toggle('on', S.newBest);
    el.oLen.innerHTML = 'Ribbon: ' + S.rib.n + ' segments <span>&middot; ' + S.grazes + (S.grazes === 1 ? ' graze' : ' grazes') + '</span>';
    el.btnCont.hidden = S.continued;
    refreshShop();
    el.over.classList.add('show');
    sizePreview();
  }
  function sizePreview() {
    const r = el.preview.getBoundingClientRect();
    pw = Math.max(1, r.width); ph = Math.max(1, r.height); pdpr = V.dpr;
    el.preview.width = Math.round(pw * pdpr); el.preview.height = Math.round(ph * pdpr);
  }
  function drawPreview() {   // the run's ribbon length, drawn with the real renderer
    const n = S.rib.n, sc = solidCount(n), c = pctx, len = n * T.segRest;
    const k = Math.min(1.1, (pw - 60) / (len * 0.96)), t = performance.now() / 1000;
    c.setTransform(pdpr * k, 0, 0, pdpr * k, 0, 0);
    c.clearRect(0, 0, pw / k, ph / k);
    const x0 = (pw - 30) / k, midY = ph / 2 / k, amp = ph * 0.3 / k;
    for (let i = 0; i <= n; i++) { PX[i] = x0 - i * T.segRest * 0.96; PY[i] = midY + Math.sin(i * 0.33 - t * 3) * amp * Math.pow(i / n, 0.8); }
    drawRibbon(c, PX, PY, n, sc, t * T.hueSpeed, 1);

  }
  function refreshShop() {
    const owned = !!SV.owned[SKU_STYLES];
    document.querySelectorAll('.sw').forEach(b => {
      b.classList.toggle('sel', b.dataset.pal === SV.palette);
      b.classList.toggle('locked', b.dataset.pal !== 'prism' && !owned);
    });
    el.btnBuy.hidden = owned;
  }
  function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('on'); toastT = performance.now() + 1600; }
  function setPalette(name) { SV.palette = name; save(); buildPalette(name); refreshShop(); }
  function mute() { el.mute.innerHTML = SV.mute ? ICON_OFF : ICON_ON; el.mute.setAttribute('aria-pressed', SV.mute ? 'true' : 'false'); }
  function toggleMute() { SV.mute = !SV.mute; save(); mute(); Sfx.unlock(); Sfx.setMute(SV.mute); }

  el.mute.addEventListener('click', e => { e.currentTarget.blur(); toggleMute(); });
  el.btnCont.addEventListener('click', e => {
    e.currentTarget.blur();
    if (S.continued || S.phase !== 'over') return;
    Monetization.showRewarded('rewarded_trim_continue', () => continueRun(), () => toast('No reward — tap to retry'));
  });
  document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
    const pal = b.dataset.pal;
    if (pal !== 'prism' && !SV.owned[SKU_STYLES]) Monetization.purchase(SKU_STYLES, () => { setPalette(pal); toast('Ribbon Styles unlocked'); });
    else setPalette(pal);
  }));
  el.btnBuy.addEventListener('click', () => Monetization.purchase(SKU_STYLES, () => { setPalette('aurora'); toast('Ribbon Styles unlocked'); }));
  el.btnRestore.addEventListener('click', () => Monetization.restorePurchases(list => { refreshShop(); toast(list.length ? 'Purchases restored' : 'Nothing to restore'); }));
  return { phase, tick, combo, sizePreview, mute, toggleMute, toast };
})();

// =====================================================================
// Monetization mock — AdMob / store swap point
// =====================================================================
const Monetization = {
  busy: false, _timer: 0,
  _open(html) { const m = document.getElementById('modal'); document.getElementById('mbox').innerHTML = html; m.classList.add('show'); },
  _close() { document.getElementById('modal').classList.remove('show'); clearTimeout(this._timer); this.busy = false; },
  // AdMob swap point: replace this body with the native rewarded ad, e.g. @capacitor-community/admob:
  //   await AdMob.prepareRewardVideoAd({ adId: id }); await AdMob.showRewardVideoAd();
  //   listen for RewardAdPluginEvents.Rewarded -> onReward(), RewardAdPluginEvents.Dismissed -> onDismiss().
  showRewarded(id, onReward, onDismiss) {
    if (this.busy) return; this.busy = true;
    this._open('<h2>Loading ad…</h2><p>Mock rewarded video · ' + id + '</p><div class="bar"><i id="adbar"></i></div>' +
      '<button class="link" id="adSkip" data-ui>Close without reward</button>');
    const bar = document.getElementById('adbar');
    void bar.offsetWidth;
    bar.style.transition = 'transform ' + T.adDuration + 's linear'; bar.style.transform = 'scaleX(1)';
    this._timer = setTimeout(() => { this._close(); try { if (onReward) onReward(id); } catch (e) { /* keep the game alive */ } }, T.adDuration * 1000);
    document.getElementById('adSkip').onclick = () => { this._close(); if (onDismiss) onDismiss(id); };
  },
  // IAP swap point (e.g. cordova-plugin-purchase / RevenueCat): non-consumable SKU.
  purchase(sku, onSuccess) {
    if (this.busy) return; this.busy = true;
    this._open('<h2>Ribbon Styles pack</h2><p>Unlocks the Aurora and Ember ribbon palettes.<br>Mock store — no charge.</p>' +
      '<button class="btn" id="mBuy" data-ui>Buy · $1.99</button><button class="link" id="mCancel" data-ui>Cancel</button>');
    document.getElementById('mCancel').onclick = () => this._close();
    document.getElementById('mBuy').onclick = () => {
      document.getElementById('mbox').innerHTML = '<h2>Processing…</h2>';
      this._timer = setTimeout(() => { SV.owned[sku] = true; save(); this._close(); if (onSuccess) onSuccess(sku); }, 700);
    };
  },
  // Real app: ask the store for owned non-consumables. The mock re-reads what was persisted locally.
  restorePurchases(onDone) {
    if (this.busy) return; this.busy = true;
    this._open('<h2>Restoring purchases…</h2>');
    this._timer = setTimeout(() => { load(); this._close(); if (onDone) onDone(Object.keys(SV.owned).filter(k => SV.owned[k])); }, 600);
  },
};

// =====================================================================
// Audio — procedural WebAudio, created on first gesture, never throws
// =====================================================================
const Sfx = (() => {
  let ac = null, out = null, noise = null;
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  function unlock() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ac = new AC(); out = ac.createGain(); out.gain.value = SV.mute ? 0 : 0.6; out.connect(ac.destination);
        noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.3), ac.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      }
      if (ac.state === 'suspended') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) { ac = null; }
  }
  const ready = () => ac && out && !SV.mute && ac.state === 'running';
  function tone(type, f0, f1, dur, vol, delay) {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.03);
  }
  const safe = fn => (...a) => { if (!ready()) return; try { fn(...a); } catch (e) { /* ignore */ } };
  return {
    unlock,
    setMute(m) { try { if (out) out.gain.value = m ? 0 : 0.6; } catch (e) { /* ignore */ } },
    suspend() { try { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); } catch (e) { /* ignore */ } },
    flap: safe(() => tone('triangle', 380, 720, 0.07, 0.13)),
    score: safe(() => { tone('sine', 988, 988, 0.08, 0.07); tone('sine', 1480, 1480, 0.1, 0.045, 0.045); }),
    graze: safe(c => { const f = 1175 * Math.pow(2, PENTA[Math.min(c - 1, 9)] / 12); tone('sine', f, f, 0.5, 0.06); tone('sine', f * 2, f * 2, 0.3, 0.02, 0.01); }),
    death: safe(() => {
      tone('sine', 150, 42, 0.42, 0.4);
      const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise; lp.type = 'lowpass'; lp.frequency.value = 700; g.gain.value = 0.35;
      src.connect(lp); lp.connect(g); g.connect(out); src.start();
    }),
  };
})();

// =====================================================================
// Loop — fixed 1/120 s physics, rAF render with interpolation
// =====================================================================
let last = 0, acc = 0, raf = 0, running = false;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const t0 = performance.now();
  let dt = last ? (now - last) / 1000 : 0; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  if (!S.manual && !S.paused) {
    acc += dt; if (acc > T.maxAccum) acc = T.maxAccum;
    while (acc >= T.step) { stepSim(T.step); acc -= T.step; }
  }
  render(S.manual || S.paused ? 1 : acc / T.step);
  UI.tick();
  const ms = performance.now() - t0; S.perf.last = ms; S.perf.sum += ms; S.perf.frames++;
}
function startLoop() { if (running) return; running = true; last = 0; raf = requestAnimationFrame(frame); }
function stopLoop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopLoop(); Sfx.suspend(); if (S.phase === 'play' && !S.manual) { S.paused = true; UI.phase(); } }
  else { acc = 0; startLoop(); }
});

function step(dtSeconds) {   // deterministic: switches the rAF loop to render-only
  S.manual = true;
  const n = Math.max(0, Math.round((+dtSeconds || 0) / T.step));
  for (let i = 0; i < n; i++) stepSim(T.step);
  UI.tick();
  return S;
}

load();
buildPalette(SV.palette);
resize();
restart();
UI.mute();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
startLoop();

window.Ribbon = { state: S, TUNING, save, load, restart, flap, step, solidCount };
})();
</script>
</body>
</html>
